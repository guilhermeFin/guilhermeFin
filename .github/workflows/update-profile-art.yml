name: Update profile art

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps (photo + tooling)
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-photo.txt
      - name: Fetch contributions
        run: python scripts/fetch_contributions.py ${{ github.repository_owner }}
      - name: Render heatmap
        run: python scripts/render_heatmap_svg.py
      - name: Prepare photo
        run: |
          # use provided source photo if present, otherwise fall back to default
          SRC=$(git ls-files | grep -E "source-photo\.jpg|.*\.jpg" | head -n1 || true)
          if [ -n "$SRC" ]; then
            echo "Found source photo: $SRC"
            python scripts/prep_photo.py "$SRC" data/source-prepped.png
          else
            echo "No source photo found; skipping prep"
          fi
      - name: Generate ASCII SVG
        run: |
          if [ -f data/source-prepped.png ]; then
            python scripts/make_ascii_svg.py data/source-prepped.png avi-ascii.svg
          else
            echo "No prepped photo available; skipping ascii generation"
          fi
      - name: Commit & push generated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh generated profile art [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg avi-ascii.svg data/source-prepped.png"