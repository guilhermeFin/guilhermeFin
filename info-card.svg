      <text x="18" y="58" font-family="Inter, sans-serif" font-size="16" fill="#9aa3b2"><tspan font-weight="700">Now</tspan></text>
      <text x="120" y="58" font-family="Inter, sans-serif" font-size="16" fill="#9aa3b2">AI Business Analytics &amp; Econometrics student at USF / Building ML‑driven analytics &amp;</text>
