      <text x="120" y="158" font-family="Inter, sans-serif" font-size="16" fill="#9aa3b2">React (TS) • Next.js (App Router) • Tailwind CSS • Supabase (Postgres) • OpenAI • LangChain •</text>
      <text x="120" y="178" font-family="Inter, sans-serif" font-size="16" fill="#9aa3b2">Prisma/Drizzle • Vercel • GitHub Actions</text>
    </g><g transform="translate(0,0)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.24s" fill="freeze"/>
      <text x="18" y="258" font-family="Inter, sans-serif" font-size="16" fill="#9aa3b2"><tspan font-weight="700">Highlights</tspan></text>
      <text x="120" y="258" font-family="Inter, sans-serif" font-size="16" fill="#9aa3b2">• Built a quantitative research operating system.</text>
      <text x="120" y="278" font-family="Inter, sans-serif" font-size="16" fill="#9aa3b2">• Created Hermes, a self-improving trading bot covering five asset classes.</text>
      <text x="120" y="298" font-family="Inter, sans-serif" font-size="16" fill="#9aa3b2">• Developed Vantage, a 12-section portfolio stress-testing suite designed for wealth managers.</text>
      <text x="120" y="318" font-family="Inter, sans-serif" font-size="16" fill="#9aa3b2">• Built M&amp;A tooling that generates teasers, Confidential Information Memorandums (CIMs),</text>
      <text x="120" y="338" font-family="Inter, sans-serif" font-size="16" fill="#9aa3b2">and a scored buyer universe.</text>
      <text x="120" y="358" font-family="Inter, sans-serif" font-size="16" fill="#9aa3b2">• Created a Garmin Coach pipeline for endurance training.</text>
      <text x="120" y="378" font-family="Inter, sans-serif" font-size="16" fill="#9aa3b2">• Built an options trading bot based on a profitable, backtested trading edge.</text>
